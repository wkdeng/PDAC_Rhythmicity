# Snakemake SLURM profile for TACC LS6 (Snakemake v9+)
executor: cluster-generic
cluster-generic-submit-cmd: "bash profile/slurm/submit.sh -A {resources.account} -p {resources.partition} -t {resources.walltime} -N 1 -n 1 -J pdac_{rule}_{wildcards} -o logs/slurm_%j_{rule}_{wildcards}.out -e logs/slurm_%j_{rule}_{wildcards}.err --parsable"
cluster-generic-cancel-cmd: scancel
cluster-generic-status-cmd: "bash profile/slurm/status.sh"
jobs: 60
latency-wait: 300
retries: 1
keep-going: true
printshellcmds: true
